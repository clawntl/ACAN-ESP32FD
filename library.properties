name=ACAN_ESP32FD
version=0.1.0
author=Written for a custom ESP32-S3 / ESP32-C5 project, in the style of Pierre Molinaro's ACAN family of libraries (https://github.com/pierremolinaro)
maintainer=you <you@example.com>
sentence=ACAN-style CAN / CAN FD driver for ESP32-S3 and ESP32-C5 with fully configurable bit timing and sample points.
paragraph=Wraps the ESP-IDF v5.5+ "twai_node" driver (esp_twai.h / esp_twai_onchip.h) behind the same kind of API as ACANFD-STM32 / ACAN2517FD: a Settings object that computes explicit BRP/PROP_SEG/PHASE_SEG1/PHASE_SEG2/SJW from a desired bit rate and sample point (fully overridable), plus CANMessage/CANFDMessage classes shared with the rest of the ACAN family. ESP32-S3 gets classic CAN only; ESP32-C5 additionally gets CAN FD (arbitration + data phase, independent sample points). Requires arduino-esp32 core 3.3.9 or newer (ESP-IDF 5.5.4+).
